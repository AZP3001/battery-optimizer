plugins { id "com.android.application" }

android {
    namespace "io.github.azp3001.batteryoptimizer"
    compileSdk 35
    defaultConfig {
        applicationId "io.github.azp3001.batteryoptimizer"
        minSdk 24
        targetSdk 35
        // set by the Release workflow: the release tag and the run number
        versionCode Integer.parseInt((findProperty("appCode") ?: "1").toString())
        versionName (findProperty("appVersion") ?: "dev").toString()
    }
    // shortcut: signed with the build machine's debug key, so each release needs the old app uninstalled first; use a fixed key to allow updating in place.
    buildTypes { release { signingConfig signingConfigs.debug } }
    // The app shows the same web app as the website, plus the script it reads its app table from.
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir("web").get().asFile
}

tasks.register("copyWeb", Sync) {
    from("../../web")
    from("../../battery-optimizer-linux.sh")
    into(layout.buildDirectory.dir("web"))
}
preBuild.dependsOn copyWeb

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
