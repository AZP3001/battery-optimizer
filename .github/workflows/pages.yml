# Publishes the website (web/ plus the two scripts it links to) to GitHub Pages
# every time something the site uses changes on main.
name: Website
on:
  push:
    branches: [main]
    paths: ["web/**", "battery-optimizer-linux.sh", "battery-optimizer-windows.bat", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The page reads the app table from the script, and offers both scripts for download.
      - run: cp battery-optimizer-linux.sh battery-optimizer-windows.bat web/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
