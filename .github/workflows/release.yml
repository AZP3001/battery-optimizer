# Publishes a GitHub Release with the script attached whenever a tag like v1.0 is pushed.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n battery-optimizer-linux.sh && ./battery-optimizer-linux.sh selfcheck
      - run: gh release create "$GITHUB_REF_NAME" battery-optimizer-linux.sh --title "Battery Optimizer for Linux $GITHUB_REF_NAME" --notes "First release. Download battery-optimizer-linux.sh, run chmod +x on it, then ./battery-optimizer-linux.sh battery. See the README for setup."
        env:
          GH_TOKEN: ${{ github.token }}
