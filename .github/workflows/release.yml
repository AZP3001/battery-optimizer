# Publishes a GitHub Release with the Linux script, the Windows .bat and the Android app (APK) attached: on a pushed tag like v1.0,
# or by hand (Actions > Release > Run workflow), which also creates the tag.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0"
        default: "v1.0"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n battery-optimizer-linux.sh && ./battery-optimizer-linux.sh selfcheck
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # The signing key must stay the same across releases, or the app cannot update itself.
      - run: |
          [ -n "$KEYSTORE" ] || { echo "::error::Add the ANDROID_KEYSTORE secret (Settings > Secrets and variables > Actions), see the README"; exit 1; }
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          cd android && ./gradlew --no-daemon assembleRelease -PappVersion="$TAG" -PappCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk ../battery-optimizer.apk
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          TAG: ${{ inputs.version || github.ref_name }}
      # Block scalar (|) so the colons in the notes are not read as YAML.
      - run: |
          gh release create "$TAG" --target "$GITHUB_SHA" battery-optimizer-linux.sh battery-optimizer-windows.bat battery-optimizer.apk --title "Battery Optimizer $TAG" --notes "Linux: download battery-optimizer-linux.sh, run chmod +x on it, then ./battery-optimizer-linux.sh battery. Windows: download battery-optimizer-windows.bat and battery-optimizer-linux.sh into the same folder and double-click the .bat. Android: install battery-optimizer.apk and connect through Shizuku. See the README for setup."
        env:
          TAG: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
